<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Proxy Health Monitor: open-source HTTP, HTTPS and SOCKS5 proxy monitoring">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#0d1c36"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26C7D3"/>
      <stop offset="1" stop-color="#1e8bff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1aa3ad" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1aa3ad" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16243f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect x="700" y="0" width="580" height="360" fill="url(#grid)" opacity="0.7"/>

  <!-- mark + title -->
  <rect x="72" y="74" width="64" height="64" rx="17" fill="url(#mark)"/>
  <path d="M83 108h11l5.5-13 8.5 23.5 6.5-17 4 6.5H126" fill="none" stroke="#06121f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="196" fill="#e8eef7" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Proxy Health Monitor</text>
  <text x="72" y="238" fill="#b4c1d6" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21">Uptime, latency, incidents and alerts for the proxies you run.</text>

  <!-- protocol chips -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="270" width="72" height="32" rx="16" fill="#15213a" stroke="#22324f"/>
    <text x="108" y="291" fill="#e8eef7" text-anchor="middle">HTTP</text>
    <rect x="154" y="270" width="150" height="32" rx="16" fill="#15213a" stroke="#22324f"/>
    <text x="229" y="291" fill="#e8eef7" text-anchor="middle">HTTPS CONNECT</text>
    <rect x="314" y="270" width="86" height="32" rx="16" fill="#15213a" stroke="#22324f"/>
    <text x="357" y="291" fill="#e8eef7" text-anchor="middle">SOCKS5</text>
    <rect x="410" y="270" width="112" height="32" rx="16" fill="#15213a" stroke="#22324f"/>
    <text x="466" y="291" fill="#e8eef7" text-anchor="middle">Prometheus</text>
  </g>

  <!-- illustrative chart card (no data) -->
  <g transform="translate(760 62)">
    <rect width="452" height="236" rx="16" fill="#101a2c" stroke="#22324f"/>
    <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      <rect x="22" y="20" width="96" height="26" rx="13" fill="#0f2a17" stroke="#1d4d26"/>
      <circle cx="38" cy="33" r="6" fill="#0ca30c"/>
      <text x="52" y="38" fill="#7fe07f">Healthy</text>
      <rect x="128" y="20" width="106" height="26" rx="13" fill="#2a2207" stroke="#5a4510"/>
      <path d="M144 26l7 12.5h-14z" fill="#fab219"/>
      <text x="158" y="38" fill="#ffd36b">Degraded</text>
      <rect x="244" y="20" width="82" height="26" rx="13" fill="#2c1014" stroke="#5c1f24"/>
      <circle cx="260" cy="33" r="6" fill="#d03b3b"/>
      <text x="274" y="38" fill="#ff9a9a">Down</text>
    </g>
    <line x1="22" y1="196" x2="430" y2="196" stroke="#22324f"/>
    <line x1="22" y1="150" x2="430" y2="150" stroke="#1a2741"/>
    <line x1="22" y1="104" x2="430" y2="104" stroke="#1a2741"/>
    <line x1="22" y1="96" x2="430" y2="96" stroke="#ec835a" stroke-dasharray="5 5" stroke-width="1.5"/>
    <path d="M22 168 L62 160 L102 164 L142 150 L182 156 L222 140 L262 146 L302 118 L342 132 L382 150 L430 144 L430 196 L22 196 Z" fill="url(#area)"/>
    <path d="M22 168 L62 160 L102 164 L142 150 L182 156 L222 140 L262 146 L302 118 L342 132 L382 150 L430 144" fill="none" stroke="#1aa3ad" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M22 140 L62 132 L102 138 L142 120 L182 128 L222 110 L262 118 L302 84 L342 100 L382 122 L430 114" fill="none" stroke="#6f7ef0" stroke-width="2.5" stroke-dasharray="8 4" stroke-linejoin="round" stroke-linecap="round"/>
    <g>
      <rect x="22" y="212" width="12" height="12" rx="2" fill="#0ca30c"/>
      <rect x="38" y="212" width="12" height="12" rx="2" fill="#0ca30c"/>
      <rect x="54" y="212" width="12" height="12" rx="2" fill="#0ca30c"/>
      <rect x="70" y="212" width="12" height="12" rx="2" fill="#0ca30c"/>
      <rect x="86" y="212" width="12" height="12" rx="2" fill="#fab219"/>
      <rect x="102" y="212" width="12" height="12" rx="2" fill="#0ca30c"/>
      <rect x="118" y="212" width="12" height="12" rx="2" fill="#0ca30c"/>
      <rect x="134" y="212" width="12" height="12" rx="2" fill="#d03b3b"/>
      <rect x="150" y="212" width="12" height="12" rx="2" fill="#fab219"/>
      <rect x="166" y="212" width="12" height="12" rx="2" fill="#0ca30c"/>
      <rect x="182" y="212" width="12" height="12" rx="2" fill="#0ca30c"/>
      <rect x="198" y="212" width="12" height="12" rx="2" fill="#0ca30c"/>
    </g>
  </g>
</svg>
