# nginx in front of proxy-monitor, with TLS. proxy-monitor stays on
# 127.0.0.1:8090 and checks the Host header, so list the public name in
# server.allowed_hosts:
#
#   server:
#     listen: 127.0.0.1:8090
#     auth_token: ${PROXY_MONITOR_TOKEN}
#     allowed_hosts: [monitor.example.com]
server {
    listen 443 ssl http2;
    server_name monitor.example.com;

    ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;

    # Optional extra layer: restrict to your office or VPN.
    # allow 203.0.113.0/24;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
